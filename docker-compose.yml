services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./db/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql:ro

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://practice:practice@postgres:5432/practice?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
