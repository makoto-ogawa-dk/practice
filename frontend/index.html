<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要員山積みシステム</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>要員山積みシステム</h1>
      <nav>
        <button data-view="allocations">山積み</button>
        <button data-view="resources">要員</button>
        <button data-view="projects">案件</button>
      </nav>
    </header>

    <main>
      <section id="view-allocations" class="view">
        <h2>山積み</h2>
        <p>今後、検索と登録フォームを追加予定です。</p>
      </section>

      <section id="view-resources" class="view hidden">
        <h2>要員一覧</h2>
        <button id="reload-resources">再読み込み</button>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>要員名</th>
              <th>所属</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="resources-table-body"></tbody>
        </table>
        <p id="resources-message"></p>
      </section>

      <section id="view-projects" class="view hidden">
        <h2>案件</h2>
        <p>今後、一覧と編集機能を追加予定です。</p>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
